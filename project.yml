# XcodeGen 프로젝트 정의 (권장 경로).
#   brew install xcodegen && cd RuneRivals && xcodegen generate && open RuneRivals.xcodeproj
# 엔진 소스(Sources/RuneRivalsEngine)를 앱 타깃에 직접 컴파일 → 별도 패키지 링크 불필요.
name: RuneRivals
options:
  bundleIdPrefix: com.runerivals
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "2"
    TARGETED_DEVICE_FAMILY: "1,2"
packages:
  # 카카오 로그인 SDK(네이티브). 로그인·사용자·공통 모듈만 사용.
  KakaoOpenSDK:
    url: https://github.com/kakao/kakao-ios-sdk
    from: "2.24.0"
targets:
  RuneRivals:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Sources/RuneRivalsEngine
    dependencies:
      - package: KakaoOpenSDK
        product: KakaoSDKUser
      - package: KakaoOpenSDK
        product: KakaoSDKAuth
      - package: KakaoOpenSDK
        product: KakaoSDKCommon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.brick0123.runeup
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # 배포 서명(TestFlight/App Store) — 유료 팀(jinho han).
        DEVELOPMENT_TEAM: "372H39X75P"
        CODE_SIGN_STYLE: Automatic
    # 생성 Info.plist — 가로 고정 + 카카오 로그인 URL 스킴/조회 스킴 포함.
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 룬컬렉트
        # 빌드/버전은 빌드설정 변수로 → release.sh 의 CURRENT_PROJECT_VERSION 오버라이드가 반영됨.
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        UILaunchScreen: {}
        # 표준 암호화(HTTPS)만 사용 → 수출 규정 면제. TestFlight 암호화 질문 스킵.
        ITSAppUsesNonExemptEncryption: false
        # 가로 전용 게임 → iPad 멀티태스킹 미지원(전체화면)으로 선언해야 orientations 제한 허용됨.
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # 카카오 로그인 리다이렉트(kakao<네이티브앱키>://oauth).
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - kakaod2d31930741da8e53db9be21118dc1ee
        # 카카오톡 앱으로 로그인/전환 가능 여부 조회.
        LSApplicationQueriesSchemes:
          - kakaokompassauth
          - kakaotalk
          - kakaolink
